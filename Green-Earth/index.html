<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Daisyui + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body>
    <!-- Navbar Section -->
    <header class="bg-[#15803D]">
        <div class="max-w-7xl mx-auto">
            <div class="navbar shadow-sm ">
                <div class="navbar-start ">
                    <div class="dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h8m-8 6h16" />
                            </svg>
                        </div>
                        <ul tabindex="-1"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                            <li><a>About</a></li>
                            <li><a>Gallery</a> </li>
                            <li><a>Plan a tree</a></li>
                        </ul>
                    </div>
                    <a class="text-xl text-white">Green Earth</a>
                </div>
                <div class="navbar-center hidden lg:flex">
                    <ul class="menu menu-horizontal px-1">
                        <li><a class="text-white">About</a></li>
                        <li><a class="text-white">Gallery</a></li>
                        <li><a class="text-white">Plan a Tree</a></li>
                    </ul>
                </div>
                <div class="navbar-end">
                    <a class="btn bg-[#FACC15] border-none rounded-full  text-white">Plant a
                        Tree</a>
                </div>
            </div>
        </div>
    </header>
    <!-- Banner Section -->
    <section class="bg-[#E7F6E9]">
        <div class="max-w-7xl mx-auto h-[300px] flex items-center justify-between px-6 overflow-hidden">
            <!-- Left Image -->
            <div class="w-1/4">
                <img src="./assets/hero-leaf1.png" alt="Left Leaf" class="w-full max-w-[260px]" />
            </div>

            <!-- Banner Content -->
            <div class="w-2/4 text-center">
                <h1 class="text-5xl font-bold text-gray-800">
                    Plant a Tree, Grow a Future
                </h1>

                <p class="mt-4 text-gray-600 max-w-lg mx-auto">
                    Join our mission to plant 1 million trees and make the Earth greener
                    for future generations.
                </p>

                <button class="btn bg-[#FACC15] hover:bg-yellow-400 border-none rounded-full mt-6 px-7 text-white">
                    Get Involved
                </button>
            </div>

            <!-- Right Image -->
            <div class="w-1/4 flex justify-end">
                <img src="./assets/hero-leaf2.png" alt="Right Leaf" class="w-full max-w-[260px]" />
            </div>
        </div>
    </section>
    <main class="max-w-7xl mx-auto">
        <h2 class="text-[#4ade80] font-bold text-4xl ">Choose your trees</h2>
        <div class="grid grid-cols-12 gap-8">
             <!-- Categories -->
            <div class="bg-red-500 col-span-3">
              <h2 class="font-bold text-4xl ">Categories</h2>
              <div>
                <button class="btn btn-success w-full" id="all-trees-btn">All Trees</button>
                <!-- Category Container -->
                <div id="categoriesContainer" class="space-y-3">
                    <!-- categories wii be dynamically loaded here by JS -->

                </div>
              </div>
        

            </div>
             <!-- Trees -->
            <div class="bg-yellow-500 col-span-6">Trees</div>
             <!-- cart -->
            <div class="bg-green-500 col-span-3">Cart</div>
        </div>
    </main>


<script src="./script.js"></script>
</body>



</html>
