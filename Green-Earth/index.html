<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trees Zone</title>

    <!-- Tailwind + Daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container mx-auto ">
        <h2 class="text-[#4ade80] font-bold text-4xl text-center">Choose Your Tree</h2>
        <div class="grid grid-cols-12 gap-3">

            <div class="col-span-3 bg-white rounded shadow-xl p-4 space-y-5">
                <h2 class="font-bold text-2xl">Categories</h2>
                <div class="space-y-3 sticky top-8">
                    <button class="btn btn-active btn-primary w-full mb-3" id="allTreesBtn">All Trees</button>

                    <!-- categories Container -->
                    <div id="cateGories-Container" class="space-y-3">


                    </div>
                </div>
            </div>

            <div class="col-span-6 bg-white shadow-xl rounded">

                <!-- Loading Spinner -->
                <div id="loading-spinner" class="h-[20vh] mt-40 hidden text-center justify-center items-center">
                    <span class="loading loading-spinner loading-xl"></span>
                </div>

                <!-- Trees Container -->

                <div id="tress-container" class="grid grid-cols-1 sm:grid-cols-3 gap-3 p-4">



                </div>




            </div>

            <div class="col-span-3 bg-white shadow-xl p-4 rounded space-y-2">
                <h2 class="font-bold text-2xl">Cart</h2>
                <div class="space-y-4  rounded-xl">
                    <div id="cartContainer" class="space-y-3">



                    </div>



                    <!-- Total Amount -->
                    <div class="flex justify-between items-center bg-green-50 rounded-lg p-4 my-3 font-bold shadow">
                        <span>Total:</span>
                        <span id="totalPrice">$0</span>

                    </div>
                </div>
            </div>
        </div>







        <!-- modal -->

        <dialog id="trees_details_modal" class="modal">
            <div class="modal-box">
                <!-- Modal Header -->
                <div class="flex justify-between items-start mb-4">
                    <h3 class="font-bold text-xl text-green-700" id="modalTitle">Tree Details</h3>
                    <button class="btn btn-sm btn-circle btn-ghost"
                        onclick="document.getElementById('trees_details_modal').close()">X</button>

                </div>

                <!-- Modal Content -->

                <div class="gap-6">
                    <img id="modalImage" src="" alt="plant" class="w-full h-[250px] object-cover rounded-lg mb-12">

                    <!-- Plant Details -->
                    <div class="">
                        <p>
                            <span class="font-bold">Category: </span>
                            <span id="modalcategory" class="badge badge-primary"></span>
                        </p>

                        <p class="text-sm text-gray-600 mb-4">
                            <span id="modalDescription"></span>
                        </p>

                        <div class="flex items-baseline gap-2 mb-6">
                            <span class="text-3xl font-bold text-green-600">$ <span id="modalPrice">0</span></span>

                        </div>
                    </div>
                </div>



            </div>
        </dialog>
    </main>
    <script src="./script.js"></script>
</body>

</html>
