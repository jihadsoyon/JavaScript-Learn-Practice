<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <!-- tailwin + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Outfit", sans-serif;

        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-32">
        <img src="./assets/Logo-full.png" alt="">
    </div>
    <div class="form pt-10">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Mobile Number</label>
                    <input id="input-number" maxlength="11" minlength="11" type="number"
                        class="input rounded-full bg-base-200" placeholder="Enter Your Number" />
                    <br>
                    <label class="label text-neutral font-bold">4 Digit Pin</label>
                    <input id="input-pin" maxlength="4" type="password" class="input rounded-full bg-base-200"
                        placeholder="Enter 4 Digit Pin" value="1234" />
                    <div><a class="link link-hover font-bold">Forgot password?</a></div>
                    <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
                </fieldset>
            </div>
        </div>
    </div>
    <footer class="w-11/12 mx-auto py-8 mt-10 border-t-2 border-gray-300">
        <div class="grid grid-cols-2 gap-6">
            <div>
                <img src="assets/logo.png" alt="" class="w-[50px] mb-2">
                <p class="text-neutral/50 text-sm">Fast, secure and reliable digital payments for everyone.</p>
                <div class="flex gap-3 mt-3">
                    <a href="#" class="btn btn-circle btn-sm btn-primary btn-soft"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="btn btn-circle btn-sm btn-primary btn-soft"><i
                            class="fa-brands fa-twitter"></i></a>
                    <a href="#" class="btn btn-circle btn-sm btn-primary btn-soft"><i
                            class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
            <div>
                <h3 class="font-bold mb-2">Quick Links</h3>
                <ul class="text-neutral/50 text-sm flex flex-col gap-1">
                    <li><a href="#" class="link link-hover">About Us</a></li>
                    <li><a href="#" class="link link-hover">Support</a></li>
                    <li><a href="#" class="link link-hover">Privacy Policy</a></li>
                </ul>
            </div>
        </div>
        <div class="text-center text-neutral/40 text-xs mt-6 pt-4 border-t border-gray-200">
            &copy; 2026 Payoo. All rights reserved.
        </div>
    </footer>
    <script src="./script/login.js"></script>
</body>

</html>
